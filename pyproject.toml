[project]
name = "glacier-buffer-utac"
version = "1.0.1"
description = "Real glacial hydrological buffer / peak-water science (Huss & Hock 2018, Milner et al. 2017, Cauvy-Fraunie et al. 2016) -- downstream buffer-loss cascade, no UTAC/CREP bridge"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Römer, Johann" }]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/GenesisAeon/glacier-buffer-utac"
Repository = "https://github.com/GenesisAeon/glacier-buffer-utac"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glacier_buffer_utac"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=glacier_buffer_utac --cov-report=term-missing -v"
